<script src="./support.js"></script>
<style>
  :root{
    --paper:#F8F8F6; --sheet:#FFFFFF; --ink:#1A1F1B; --muted:#6B6B65;
    --rule:#DCDCD7; --rule-strong:#B4B4AD; --green:#1E4A34; --oxblood:#8A3520;
    --sans:'Helvetica Neue',Arial,Helvetica,sans-serif;
    --display:Didot,'Bodoni MT','Times New Roman',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .lbl{font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
  .dsp{font-family:var(--display);font-weight:500}
  .m{color:var(--muted)} .rs{color:var(--rule-strong)}
  .field{border:0;border-bottom:1px solid var(--rule-strong);padding:7px 0 6px;font-size:13px;
         background:transparent;width:100%;display:block}
</style>

<div style="min-height:820px;display:grid;grid-template-columns:1fr 1fr">

  <div style="padding:64px;display:flex;flex-direction:column;justify-content:space-between">
    <div>
      <div class="lbl m">Portfolio · Internal</div>
      <div class="dsp" style="font-size:56px;line-height:1;letter-spacing:-.02em;margin-top:22px">
        Task Studio</div>
      <div style="height:2px;background:var(--ink);margin-top:22px;max-width:360px"></div>
      <p style="margin:26px 0 0;max-width:400px;font-size:14px;line-height:1.65">
        The user never fills in a status report. He works, and the report writes itself.
      </p>
    </div>
    <div class="m" style="font-size:11px;line-height:1.7">
      Single user. Everything sits behind this page.<br>
      Supabase Auth, one account, RLS on every table.
    </div>
  </div>

  <div style="border-left:1px solid var(--rule);background:var(--sheet);padding:64px;display:flex;align-items:center">
    <div style="width:100%;max-width:340px">
      <h2 class="dsp" style="font-size:30px;margin:0">Sign in</h2>

      <div style="margin-top:34px">
        <div class="lbl m">E-mail</div>
        <div class="field">mikkel@example.com</div>
      </div>

      <div style="margin-top:26px">
        <div class="lbl m">Password</div>
        <div class="field rs">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div>
      </div>

      <div style="margin-top:34px">
        <span style="display:block;width:100%;text-align:center;padding:10px 18px;font-size:10px;
          font-weight:500;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--ink);
          background:var(--ink);color:var(--paper)">Sign in</span>
      </div>
    </div>
  </div>

</div>
